name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on foreign lockfiles (PNPM only)
        shell: bash
        run: |
          if [ -f "package-lock.json" ] || [ -f "yarn.lock" ]; then
            echo "ERROR: Foreign lockfile found! TypingFreeX strictly requires PNPM (Constraint C-02)."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Linting
        run: pnpm lint

      - name: Type Checking
        run: pnpm typecheck

      - name: i18n Parity Check
        run: pnpm run check:i18n

      - name: Frontend Unit Tests
        run: pnpm test

      - name: Rust Check, Clippy & Tests
        working-directory: ./src-tauri
        run: |
          cargo check
          cargo clippy -- -D warnings
          cargo test

      - name: Frontend Build
        run: pnpm build

      - name: Bundle Budget Enforcement
        run: pnpm run check:budget
