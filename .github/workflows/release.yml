name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-release Quality Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fail on foreign lockfiles (PNPM only)
        shell: bash
        run: |
          if [ -f "package-lock.json" ] || [ -f "yarn.lock" ]; then
            echo "::error::Foreign lockfile found! Typing FreeX strictly requires PNPM (Constraint C-02)."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@888c2e1ea69ab0d4330cbf0af1ecc7b68f368cc1 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-validate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-validate-

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Linting
        run: pnpm lint

      - name: Type Checking
        run: pnpm typecheck

      - name: i18n Parity Check
        run: pnpm run check:i18n

      - name: Frontend Unit Tests
        run: pnpm test

      - name: Rust Check, Clippy & Tests
        working-directory: ./src-tauri
        run: |
          cargo check
          cargo clippy -- -D warnings
          cargo test

      - name: Frontend Build
        run: pnpm build

      - name: Bundle Budget Enforcement
        run: pnpm run check:budget

  release:
    name: Build & Package Desktop Release (${{ matrix.platform.name }})
    needs: [validate]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022

    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fail on foreign lockfiles (PNPM only)
        shell: bash
        run: |
          if [ -f "package-lock.json" ] || [ -f "yarn.lock" ]; then
            echo "::error::Foreign lockfile found! Typing FreeX strictly requires PNPM (Constraint C-02)."
            exit 1
          fi

      - name: Export SOURCE_DATE_EPOCH for Reproducible Builds
        shell: bash
        run: |
          COMMIT_EPOCH=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${COMMIT_EPOCH}" >> $GITHUB_ENV
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE//\\//}=/workspace" >> $GITHUB_ENV
          else
            echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/workspace" >> $GITHUB_ENV
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@888c2e1ea69ab0d4330cbf0af1ecc7b68f368cc1 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev flatpak flatpak-builder

      - name: Install Flatpak GNOME 47 Runtime
        if: matrix.platform.os == 'ubuntu-24.04'
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Desktop Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Typing FreeX v__VERSION__'
          releaseBody: 'See CHANGELOG.md for detailed release notes and checksums.'
          releaseDraft: false
          prerelease: false

      - name: Build & Package Flatpak
        if: matrix.platform.os == 'ubuntu-24.04'
        run: |
          mkdir -p flatpak
          cp src-tauri/target/release/typing_freex flatpak/typing_freex
          chmod +x flatpak/typing_freex
          cp src-tauri/icons/128x128.png flatpak/icon-128.png
          cd flatpak
          flatpak-builder --force-clean --disable-rofiles-fuse --repo=repo build-dir com.typing_freex.i18n.yml
          flatpak build-bundle repo typing-freex.flatpak com.typing_freex.i18n
          cd ..
          gh release upload "${{ github.ref_name }}" flatpak/typing-freex.flatpak --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate & Upload SHA256 Checksums (Linux)
        if: matrix.platform.os == 'ubuntu-24.04'
        run: |
          mkdir -p dist-checksums
          find src-tauri/target/release/bundle/deb src-tauri/target/release/bundle/appimage -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist-checksums/ \; 2>/dev/null || true
          if [ -f "flatpak/typing-freex.flatpak" ]; then
            cp flatpak/typing-freex.flatpak dist-checksums/
          fi
          cd dist-checksums
          sha256sum * > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
          cd ..
          gh release upload "${{ github.ref_name }}" dist-checksums/SHA256SUMS-linux.txt --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate & Upload SHA256 Checksums (Windows)
        if: matrix.platform.os == 'windows-2022'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-checksums
          Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -Include "*.msi","*.exe","*.zip" | Copy-Item -Destination dist-checksums
          $hashes = Get-ChildItem -Path "dist-checksums" -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $hashes | Out-File -FilePath "dist-checksums\SHA256SUMS-windows.txt" -Encoding ascii
          Get-Content "dist-checksums\SHA256SUMS-windows.txt"
          gh release upload "${{ github.ref_name }}" dist-checksums\SHA256SUMS-windows.txt --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
