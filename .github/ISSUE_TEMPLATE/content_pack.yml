name: Content Pack Submission
description: Propose or submit a new language wordlist, quote collection, or layout
title: "[CONTENT]: "
labels: ["content-pack"]
body:
  - type: dropdown
    id: pack-type
    attributes:
      label: Content Pack Type
      options:
        - Word List
        - Quotes Collection
        - Keyboard Layout
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language / Locale Code (e.g. en, id, fr, de)
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source & Licensing
      description: Provide clear public-domain or CC0 / permissive license provenance.
    validations:
      required: true
