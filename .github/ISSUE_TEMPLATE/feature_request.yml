name: Feature Request
description: Propose an idea or feature for Typing FreeX
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the issue or workflow friction.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution
      description: What you want to happen and why it improves Typing FreeX.
    validations:
      required: true
